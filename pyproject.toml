[project]
name = "apidocs-support"
version = "0.1.0"
description = "API documentation support ticket automation. LangGraph skeleton."
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-openai==1.6.0",
    "langsmith==0.12.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "streamlit==1.63.0",
    "python-frontmatter==1.3.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.1.1",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
