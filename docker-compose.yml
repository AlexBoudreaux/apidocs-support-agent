services:
  postgres:
    image: postgres:17-alpine
    container_name: apidocs-postgres
    environment:
      POSTGRES_USER: apidocs
      POSTGRES_PASSWORD: apidocs
      POSTGRES_DB: apidocs
    ports:
      - "5433:5432"
    volumes:
      - apidocs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apidocs -d apidocs"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  apidocs-pgdata:
